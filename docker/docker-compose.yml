volumes:
  polar_debris_postgres_data:
    driver: local
  kestra_postgres_data:
    driver: local
  kestra_data:
    driver: local
  kestra_tmp:
    driver: local

services:
  pgdatabase:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: polar_debris
    ports:
      - "5432:5432"
    volumes:
      - polar_debris_postgres_data:/var/lib/postgresql/data
    depends_on:
      kestra:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - "8085:80"
    depends_on:
      pgdatabase:
        condition: service_started

  kestra_postgres:
    image: postgres:15
    volumes:
      - kestra_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    image: kestra/kestra:v0.20.0
    pull_policy: always
    user: "root"
    command: server standalone
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra_tmp:/tmp/kestra-wd
      - ./kestra/flows:/flows   
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basicAuth:
              username: "admin@kestra.io"
              password: Admin1234!
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      kestra_postgres:
        condition: service_started

  terraform:
    image: hashicorp/terraform:latest
    working_dir: /workspace
    volumes:
      - ../terraform:/workspace
      - /tmp/gcp-credentials.json:/tmp/gcp-credentials.json
    environment:
      - GOOGLE_CREDENTIALS=/tmp/gcp-credentials.json
    entrypoint: [""]
    command: ["/bin/sh", "-c", "terraform init && terraform apply -auto-approve"]
    depends_on:
      kestra:
        condition: service_started

  dbt:
    image: ghcr.io/dbt-labs/dbt-bigquery:1.7.0
    working_dir: /dbt
    volumes:
      - ./polar_debris_dbt:/dbt         
      - /tmp/gcp-credentials.json:/tmp/gcp-credentials.json
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json
    command: >
      sh -c "dbt deps &&
             dbt run"
    depends_on:
      terraform:
        condition: service_completed_successfully